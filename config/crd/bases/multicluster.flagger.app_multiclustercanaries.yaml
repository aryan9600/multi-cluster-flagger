                                            the following priority levels: \n ```yaml
                                            failoverPriority: - \"topology.istio.io/network\"
                                            - \"topology.kubernetes.io/region\" -
                                            \"topology.kubernetes.io/zone\" - \"topology.istio.io/subzone\"
