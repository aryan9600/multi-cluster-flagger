                                  clusterID of an endpoint, which can be specified
                                  by pod label `topology.istio.io/cluster` or pod
                                  env `ISTIO_META_CLUSTER_ID`. - `topology.kubernetes.io/region`
                                  is used to match the region metadata of an endpoint,
                                  which maps to Kubernetes node label `topology.kubernetes.io/region`
                                  or the deprecated label `failure-domain.beta.kubernetes.io/region`.
