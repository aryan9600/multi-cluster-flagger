                                            list of labels used to sort endpoints
                                            to do priority based load balancing. This
                                            is to support traffic failover across
                                            different groups of endpoints. Suppose
                                            there are total N labels specified: \n
                                            1. Endpoints matching all N labels with
                                            the client proxy have priority P(0) i.e.
                                            the highest priority. 2. Endpoints matching
                                            the first N-1 labels with the client proxy
                                            have priority P(1) i.e. second highest
                                            priority. 3. By extension of this logic,
                                            endpoints matching only the first label
                                            with the client proxy has priority P(N-1)
                                            i.e. second lowest priority. 4. All the
                                            other endpoints have priority P(N) i.e.
                                            lowest priority. \n Note: For a label
                                            to be considered for match, the previous
                                            labels must match, i.e. nth label would
                                            be considered matched only if first n-1
                                            labels match. \n It can be any label specified
                                            on both client and server workloads. The
                                            following labels which have special semantic
                                            meaning are also supported: \n - `topology.istio.io/network`
                                            is used to match the network metadata
                                            of an endpoint, which can be specified
                                            by pod/namespace label `topology.istio.io/network`,
