                                            to match the region metadata of an endpoint,
                                            which maps to Kubernetes node label `topology.kubernetes.io/region`
                                            or the deprecated label `failure-domain.beta.kubernetes.io/region`.
                                            - `topology.kubernetes.io/zone` is used
                                            to match the zone metadata of an endpoint,
                                            which maps to Kubernetes node label `topology.kubernetes.io/zone`
                                            or the deprecated label `failure-domain.beta.kubernetes.io/zone`.
                                            - `topology.istio.io/subzone` is used
                                            to match the subzone metadata of an endpoint,
                                            which maps to Istio node label `topology.istio.io/subzone`.
