                                  of labels used to sort endpoints to do priority
                                  based load balancing. This is to support traffic
                                  failover across different groups of endpoints. Suppose
                                  there are total N labels specified: \n 1. Endpoints
                                  matching all N labels with the client proxy have
                                  priority P(0) i.e. the highest priority. 2. Endpoints
                                  matching the first N-1 labels with the client proxy
                                  have priority P(1) i.e. second highest priority.
                                  3. By extension of this logic, endpoints matching
                                  only the first label with the client proxy has priority
                                  P(N-1) i.e. second lowest priority. 4. All the other
                                  endpoints have priority P(N) i.e. lowest priority.
